[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatpipe"
version = "0.1.0"
description = "Reproducible Gaussian splat training, compression and packaging"
requires-python = "==3.11.*"
dependencies = [
    "numpy<2.0.0",
    "plyfile>=1.0",
]

[project.optional-dependencies]
# pillow backs tests/fixtures/tiny_scene.py, which the fast tier needs.
dev = ["pytest>=8.0", "pillow"]
# cupy 14 and above requires numpy>=2.0, which conflicts with the numpy<2.0.0
# pin above. torchpq imports cupy at runtime without declaring it. plas has no
# PyPI release. pillow is repeated here because the container's png block codec
# needs it without the dev extra.
bench = [
    "cupy-cuda12x==13.6.0",
    "torchpq",
    "torchmetrics>=1.9",
    "matplotlib",
    "pillow",
]

[project.scripts]
splatpipe = "splatpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and a vcvars64 shell; takes minutes; deselected by default",
]
addopts = "-m 'not gpu'"
